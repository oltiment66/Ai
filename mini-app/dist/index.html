<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI FREE · ITX.MM2DI</title>
<style>
:root{--bg:#0e1017;--panel:#171b26;--panel2:#1d2331;--line:#30394b;--text:#f5f7fb;--muted:#9ba6b8;--gold:#f0b45c;--mint:#77e0ba;--red:#ff7b87}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#27344d 0,transparent 32%),var(--bg);color:var(--text);font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:22px 26px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;border-bottom:1px solid var(--line);padding:4px 0 18px}.brand{display:flex;align-items:center;gap:12px}.logo{height:43px;width:43px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#ffc56a,#a75b2f);color:#1b1820;font-weight:900;box-shadow:0 8px 35px #d98c4d55}.brand b{font-size:17px;letter-spacing:.15em}.brand small{display:block;color:var(--muted);margin-top:4px;font-size:11px}.user{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:7px 10px 7px 14px;border-radius:16px}.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#f4c06b,#7b4bc0);display:grid;place-items:center;font-weight:800;color:#fff}.user b{display:block;font-size:12px}.user small{color:var(--gold);direction:ltr;display:block;margin-top:3px;font-size:10px}.creator{color:var(--muted);font-size:10px;margin-right:4px}.hero{display:flex;justify-content:space-between;align-items:center;gap:30px;padding:55px 0 34px}.eyebrow{color:var(--gold);font-size:10px;letter-spacing:.12em;direction:ltr}.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.2;margin:14px 0}.hero h1 span{color:var(--gold)}.hero p{color:var(--muted);line-height:2;max-width:560px;margin:0}.hero-art{width:245px;height:190px;position:relative;display:grid;place-items:center;flex:none}.ring{position:absolute;border:1px solid #77e0ba66;border-radius:50%;width:230px;height:105px;transform:rotate(-22deg)}.ring:nth-child(2){width:175px;height:210px;transform:rotate(55deg);border-color:#f0b45c66}.core{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#ffe2a5,#ae5d2d 35%,#281b2d 70%);box-shadow:0 0 35px #d8864d99;color:#ffe4b6;font-size:27px;z-index:2}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:10px 0 38px}.stat,.card,.provider{background:#171b26cc;border:1px solid var(--line);border-radius:17px}.stat{padding:17px}.stat small{color:var(--muted);display:block;font-size:11px}.stat b{display:block;color:var(--gold);font-size:22px;margin-top:8px;direction:ltr}.section-head{display:flex;justify-content:space-between;align-items:end;margin:25px 0 15px}.section-head h2{font-size:23px;margin:8px 0}.muted{color:var(--muted);font-size:12px}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--gold);color:#211a15;font-weight:700}.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--text)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{padding:17px;position:relative}.card-head{display:flex;align-items:center;gap:9px}.icon{height:36px;width:36px;border-radius:11px;background:#2b3344;display:grid;place-items:center}.status{font-size:10px;color:var(--mint)}.status.warn{color:var(--gold)}.dots{margin-right:auto;border:0;background:transparent;color:#aeb7c7;font-size:22px;line-height:1;padding:0 5px}.card h3{direction:ltr;text-align:right;font-size:14px;margin:18px 0 7px}.card p{color:var(--muted);font-size:11px;margin:0 0 17px}.meter{height:5px;background:#30394a;border-radius:5px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:5px}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:10px}.meta b{color:var(--gold);direction:ltr}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:9px 12px;font-size:11px}.tab.active{color:var(--gold);border-color:#a96e37;background:#2b241d}.providers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.provider{display:flex;align-items:center;gap:12px;padding:15px}.provider .grow{flex:1}.provider h3{font-size:13px;direction:ltr;text-align:right;margin:0 0 5px}.provider small{font-size:10px;color:var(--muted);direction:ltr;display:block}.menu{position:absolute;z-index:10;top:47px;left:14px;background:#202838;border:1px solid #4b5870;border-radius:12px;box-shadow:0 14px 35px #0008;padding:6px;min-width:145px}.menu button{display:block;width:100%;text-align:right;border:0;background:transparent;color:var(--text);padding:9px 10px;border-radius:8px;font-size:11px}.menu button:hover{background:#303b50}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:15px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#f5e3c5;color:#241d19;border-radius:12px;padding:12px 17px;font-size:12px;box-shadow:0 10px 35px #0008;z-index:20}.error{color:var(--red);background:#321f2b;border:1px solid #743b52;padding:12px;border-radius:12px;margin:18px 0;font-size:12px}.loading{color:var(--muted);padding:30px 0}@media(max-width:760px){.shell{padding:16px}.hero{padding:35px 0 20px;display:block}.hero-art{margin:26px auto 0}.stats{grid-template-columns:repeat(2,1fr)}.grid,.providers{grid-template-columns:1fr}.creator{display:none}.top{align-items:flex-start}.user{max-width:52%}.user div:last-child{overflow:hidden}.user b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style></head><body><div id="app"></div>
<script>
const app=document.getElementById('app');let state={data:null,tab:'models',menu:null,folder:'همه مدل‌ها',toast:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const tg=window.Telegram?.WebApp;tg?.ready?.();const init=()=>tg?.initData||'';const tgUser=()=>tg?.initDataUnsafe?.user||{};
function notify(s){state.toast=s;render();setTimeout(()=>{state.toast='';render()},2200)}
async function load(){try{const r=await fetch('/api/bootstrap',{headers:{'X-Telegram-Init-Data':init()}});if(!r.ok)throw Error('احراز هویت تلگرام انجام نشد');state.data=await r.json();render()}catch(e){state.data={error:e.message,models:[],providers:[],stats:{}};render()}}
function avatar(u){return u?.photo_url?`<img class="avatar" src="${esc(u.photo_url)}">`:`<div class="avatar">${esc((u?.first_name||'U')[0])}</div>`}
function menu(type,id){state.menu=state.menu===type+id?'':type+id;render()}
function modelCard(m,i){const id='m'+m.id;return `<article class="card"><div class="card-head"><div class="icon">${i%2?'🤖':'✦'}</div><span class="status">● آنلاین</span><button class="dots" onclick="menu('m','${esc(m.id)}')">⋯</button></div><h3>${esc(m.title||m.model_id)}</h3><p>${esc(m.brand||m.provider||'AI')} · ${esc(m.section)}</p><div class="meter"><i style="width:${Math.min(95,45+i*11)}%"></i></div><div class="meta"><span>مدل واقعی ربات</span><b>${esc(m.model_id)}</b></div>${state.menu===id?`<div class="menu"><button onclick="notify('مدل آماده تست است')">🧪 تست مدل</button><button onclick="notify('برای چت انتخاب شد')">💬 استفاده در چت</button><button onclick="navigator.clipboard?.writeText('${esc(m.model_id)}');notify('شناسه کپی شد')">📋 کپی شناسه</button></div>`:''}</article>`}
function providerCard(p){const id='p'+p.id;return `<div class="provider"><div class="icon">⚡</div><div class="grow"><h3>${esc(p.name)}</h3><small>${p.models||0} مدل متصل · ${p.enabled?'فعال':'غیرفعال'}</small></div><span class="status ${p.enabled?'':'warn'}">● ${p.enabled?'آنلاین':'خاموش'}</span><button class="dots" onclick="menu('p','${esc(p.id)}')">⋯</button>${state.menu===id?`<div class="menu"><button onclick="notify('وضعیت سرویس بررسی شد')">🧪 تست اتصال</button><button onclick="notify('سرویس ${esc(p.name)} فعال است')">⚙ جزئیات</button></div>`:''}</div>`}
function render(){const d=state.data||{};const u=d.user||tgUser();const models=d.models||[];const providers=d.providers||[];const folders=[...new Set(models.map(m=>m.brand||m.provider).filter(Boolean))];const filtered=models.filter(m=>(state.folder==='همه مدل‌ها'||(m.brand||m.provider)===state.folder));app.innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="logo">✦</div><div><b>AI FREE</b><small>مرکز فرمان هوشمند</small></div></div><div class="user">${avatar(tgUser())}<div><b>${esc(tgUser().first_name||u.name||'کاربر')}</b><small>${esc(tgUser().username?'@'+tgUser().username:'شناسه '+(u.id||''))}</small></div><span class="creator">سازنده · ITX.MM2DI</span></div></header>${d.error?`<div class="error">${esc(d.error)}<br><small>Mini App را از داخل خود ربات باز کن.</small></div>`:''}<section class="hero"><div><span class="eyebrow">LIVE TELEGRAM CONTROL ROOM</span><h1>رباتت، <span>واقعی</span><br>و یک‌جا.</h1><p>اطلاعات مدل‌ها، سرویس‌ها و وضعیت ربات مستقیم از API واقعی خوانده می‌شود. اینجا فقط داشبورد است، نه اطلاعات نمایشی.</p></div><div class="hero-art"><div class="ring"></div><div class="ring"></div><div class="core">✦<small>ITX.MM2DI</small></div></div></section><section class="stats"><div class="stat"><small>مدل‌های فعال</small><b>${models.length}</b></div><div class="stat"><small>سرویس‌های آنلاین</small><b>${providers.filter(p=>p.enabled).length}</b></div><div class="stat"><small>مصرف امروز</small><b>${d.stats?.today||0}</b></div><div class="stat"><small>وضعیت اتصال</small><b style="color:${d.error?'var(--red)':'var(--mint)'}">${d.error?'OFF':'LIVE'}</b></div></section><div class="section-head"><div><span class="eyebrow">REAL DATA</span><h2>کتابخانه مدل‌ها</h2></div><button class="btn ghost" onclick="load()">↻ بروزرسانی</button></div><div class="tabs"><button class="tab ${state.folder==='همه مدل‌ها'?'active':''}" onclick="state.folder='همه مدل‌ها';render()">همه مدل‌ها <small>${models.length}</small></button>${folders.map(f=>`<button class="tab ${state.folder===f?'active':''}" onclick="state.folder='${esc(f)}';render()">${esc(f)} <small>${models.filter(m=>(m.brand||m.provider)===f).length}</small></button>`).join('')}</div>${models.length?`<div class="grid">${filtered.map(modelCard).join('')}</div>`:'<div class="empty">هنوز مدل فعالی از ربات دریافت نشد.</div>'}<div class="section-head"><div><span class="eyebrow">CONNECTED NETWORK</span><h2>سرویس‌های متصل</h2></div></div>${providers.length?`<div class="providers">${providers.map(providerCard).join('')}</div>`:'<div class="empty">سرویسی از ربات دریافت نشد.</div>'}</div>${state.toast?`<div class="toast">✓ ${esc(state.toast)}</div>`:''}`}
window.menu=menu;window.notify=notify;window.load=load;window.render=render;state.data={models:[],providers:[],stats:{}};render();load();
</script></body></html>
